[project]
name = "mtg-analyser"
version = "0.1.0"
description = "Analyse a Magic: The Gathering decklist's mana curve, colours and land balance."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "typer>=0.12",
    "matplotlib>=3.9",
]

[project.scripts]
mtg-analyser = "mtg_analyser.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_analyser"]

# ---------- Ruff: linting + formatting ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import sorting, B = bugbear,
# UP = modern Python syntax, SIM = simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
